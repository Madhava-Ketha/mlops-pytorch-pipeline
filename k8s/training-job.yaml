---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: training-data-pvc
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pytorch-training-job
  namespace: ml-training
spec:
  backoffLimit: 1
  template:
    spec:
      # Bonus: Toleration for GPU-enabled nodes
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
      - name: pytorch-trainer
        image: mlops-train:v1
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
            nvidia.com/gpu: 1  # Bonus: GPU allocation
          limits:
            cpu: "4"
            memory: "8Gi"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: config-volume
          mountPath: /app/configs
        - name: data-volume
          mountPath: /app/data
          subPath: data
        - name: data-volume
          mountPath: /app/checkpoints
          subPath: checkpoints
      restartPolicy: Never
      volumes:
      - name: config-volume
        configMap:
          name: training-config
      - name: data-volume
        persistentVolumeClaim:
          claimName: training-data-pvc